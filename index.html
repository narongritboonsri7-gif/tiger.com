<!DOCTYPE html>
<html lang="th">
<head>

<title>Tiger</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;

    height: 800px;
    display: block;
    margin: 30px auto;
    border: none;

    .content {
        width: 95%;
    }

    .video {
        width: 95%;
        height: 500px;
    }

<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>วันและเวลาปัจจุบัน</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 100px;
        background: #f2f2f2;
    }

    #date {
        font-size: 32px;
        font-weight: bold;
    }

    #time {
        font-size: 60px;
        font-weight: bold;
        margin-top: 15px;
    }
</style>
</head>

<body>

<h1>วันและเวลาปัจจุบัน</h1>

<div id="date"></div>
<div id="time"></div>

<script>
function updateDateTime() {
    const now = new Date();

    const days = [
        "วันอาทิตย์",
        "วันจันทร์",
        "วันอังคาร",
        "วันพุธ",
        "วันพฤหัสบดี",
        "วันศุกร์",
        "วันเสาร์"
    ];

    const day = days[now.getDay()];
    const date = now.getDate();
    const month = now.getMonth() + 1;
    const year = now.getFullYear() + 543;

    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    document.getElementById("date").textContent =
        `${day}ที่ ${date}/${month}/${year}`;

    document.getElementById("time").textContent =
        `${hours}:${minutes}:${seconds}`;
}

updateDateTime();
setInterval(updateDateTime, 1000);
</script>

</body>
</html>
