<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    background-color: #5BFFFC;
    background-image: url("Depositphotos_31914607_XL-scaled.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, "Tahoma", sans-serif;
}

/* ==================== ส่วนหัว ==================== */

.header {
    width: 100%;
    height: auto;
    display: block;
}


/* ==================== วันและเวลาปัจจุบัน ==================== */

.datetime {
    width: 90%;
    max-width: 1000px;
    margin: 25px auto;
    padding: 25px;

    text-align: center;

    background: rgba(255, 255, 255, 0.90);
    border-radius: 20px;

    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.20);
}

.datetime-title {
    margin: 0 0 15px 0;
    font-size: 28px;
    font-weight: bold;
    color: #222;
}

#date {
    font-size: 26px;
    font-weight: bold;
    color: #444;
}

#time {
    margin-top: 10px;
    font-size: 60px;
    font-weight: bold;
    color: #1565C0;
    letter-spacing: 3px;
}


/* ==================== ส่วนเนื้อหา ==================== */

.content {
    width: 90%;
    max-width: 1600px;
    margin: 25px auto;
}


/* ==================== รูปภาพ ==================== */

.content img {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 25px auto;
}


/* ==================== วิดีโอ ==================== */

.video {
    width: 90%;
    max-width: 1600px;
    height: 800px;
    display: block;
    margin: 30px auto;
    border: none;
}


/* ==================== มือถือ ==================== */

@media (max-width: 768px) {

    .content {
        width: 95%;
    }

    .datetime {
        width: 95%;
        padding: 20px;
    }

    .datetime-title {
        font-size: 23px;
    }

    #date {
        font-size: 20px;
    }

    #time {
        font-size: 42px;
    }

    .video {
        width: 95%;
        height: 500px;
    }
}
</style>

</head>

<body>


<!-- ==================== HEADER ==================== -->

<img
    class="header"
    src="ChatGPT%20Image%2010%20%E0%B8%81.%E0%B8%A2.%202569%2012_32_23.png"
    alt="ภาพส่วนหัว">


<!-- ==================== วันและเวลาปัจจุบัน ==================== -->

<div class="datetime">

    <div class="datetime-title">
        📅 วันและเวลาปัจจุบัน
    </div>

    <div id="date">
        กำลังโหลดวันที่...
    </div>

    <div id="time">
        00:00:00
    </div>

</div>


<!-- ==================== CONTENT ==================== -->

<div class="content">

    <img
        src="ChatGPT%20Image%2010%20%E0%B8%81.%E0%B8%A2.%202569%2015_36_16.png"
        alt="ภาพเนื้อหาที่ 1">

    <img
        src="ChatGPT%20Image%2010%20%E0%B8%81.%E0%B8%A2.%202569%2015_41_40.png"
        alt="ภาพเนื้อหาที่ 2">

</div>


<!-- ==================== FACEBOOK VIDEO ==================== -->

<iframe
    class="video"
    src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F920264739972452%2F"
    scrolling="no"
    frameborder="0"
    allowfullscreen="true">
</iframe>


<!-- ==================== ระบบวันและเวลา ==================== -->

<script>

function updateDateTime() {

    const now = new Date();

    /* ชื่อวัน */
    const days = [
        "วันอาทิตย์",
        "วันจันทร์",
        "วันอังคาร",
        "วันพุธ",
        "วันพฤหัสบดี",
        "วันศุกร์",
        "วันเสาร์"
    ];

    /* ชื่อเดือน */
    const months = [
        "มกราคม",
        "กุมภาพันธ์",
        "มีนาคม",
        "เมษายน",
        "พฤษภาคม",
        "มิถุนายน",
        "กรกฎาคม",
        "สิงหาคม",
        "กันยายน",
        "ตุลาคม",
        "พฤศจิกายน",
        "ธันวาคม"
    ];

    const day = days[now.getDay()];
    const date = now.getDate();
    const month = months[now.getMonth()];
    const year = now.getFullYear() + 543;

    /* ชั่วโมง นาที วินาที */
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    /* แสดงวันที่ */
    document.getElementById("date").textContent =
        `${day}ที่ ${date} ${month} พ.ศ. ${year}`;

    /* แสดงเวลา */
    document.getElementById("time").textContent =
        `${hours}:${minutes}:${seconds}`;
}


/* เรียกใช้ทันที */
updateDateTime();

/* อัปเดตทุก 1 วินาที */
setInterval(updateDateTime, 1000);

</script>


</body>
</html>
