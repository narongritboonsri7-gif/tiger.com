<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tiger</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
}

body {
    background-color: #5BFFFC;
    background-image: url("Depositphotos_31914607_XL-scaled.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    font-family: Arial, sans-serif;
}

/* ส่วนหัว */
.header {
    width: 100%;
    height: auto;
    display: block;
}

/* ส่วนเนื้อหา */
.content {
    width: 90%;
    max-width: 1600px;
    margin: 25px auto;
}

/* รูปภาพ */
.content img {
    width: 100%;
    height: auto;
    display: block;
    margin: 0 auto 25px auto;
}

/* วิดีโอ */
.video {
    width: 90%;
    max-width: 1600px;
    height: 800px;
    display: block;
    margin: 30px auto;
    border: none;
}

/* มือถือ */
@media (max-width: 768px) {

    .content {
        width: 95%;
    }

    .video {
        width: 95%;
        height: 500px;
    }
}
</style>

</head>

<body>

<!-- ==================== HEADER ==================== -->

<img
    class="header"
    src="ChatGPT%20Image%2010%20%E0%B8%81.%E0%B8%A2.%202569%2012_32_23.png"
    alt="ภาพส่วนหัว">


<!-- ==================== CONTENT ==================== -->

<div class="content">

    <img
        src="ChatGPT%20Image%2010%20%E0%B8%81.%E0%B8%A2.%202569%2015_36_16.png"
        alt="ภาพเนื้อหาที่ 1">

    <img
        src="ChatGPT%20Image%2010%20%E0%B8%81.%E0%B8%A2.%202569%2015_41_40.png"
        alt="ภาพเนื้อหาที่ 2">

</div>


<!-- ==================== FACEBOOK VIDEO ==================== -->

<iframe
    class="video"
    src="https://www.facebook.com/plugins/video.php?href=https%3A%2F%2Fwww.facebook.com%2Freel%2F920264739972452%2F"
    scrolling="no"
    frameborder="0"
    allowfullscreen="true">
</iframe>


</body>
</html>
